<script>
/*
  ============================================================
  SCROLL NAV
  Guard: return early on dark-nav pages to prevent class conflict.
  ============================================================
*/
document.addEventListener('scroll', function () {
  const nav = document.querySelector('.floating-nav');
  if (nav.classList.contains('floating-nav--dark')) { return; }
  if (window.scrollY > 50) {
    nav.classList.add('scrolled');
  } else {
    nav.classList.remove('scrolled');
  }
});

/*
  ============================================================
  GALLERY INIT
  - Collects all real <img> items for lightbox navigation
  - Assigns staggered transition-delay to each .gallery__item
  - Sets up IntersectionObserver for scroll fade-in
  ============================================================
*/
(function () {

  const grid  = document.getElementById('gallery-grid');
  const items = Array.from(grid.querySelectorAll('.gallery__item'));

  /* Collect indices of items that contain a real <img> — used by lightbox */
  const realImageItems = items.filter(function (item) {
    return item.querySelector('img') !== null;
  });

  /* Staggered transition-delay: item index mod 4, * 80ms */
  items.forEach(function (item, i) {
    item.style.transitionDelay = (i % 4) * 80 + 'ms';
  });

  /* Scroll fade-in via IntersectionObserver */
  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('gallery__item--visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  items.forEach(function (item) {
    observer.observe(item);
  });

  /*
    ============================================================
    LIGHTBOX
    Injected once into the DOM on first use.
    Only real <img> items are navigable; placeholders are skipped.
    ============================================================
  */
  var lightbox     = null;
  var lightboxImg  = null;
  var currentIndex = 0; /* index within realImageItems array */

  function buildLightbox() {
    var lb = document.createElement('div');
    lb.id = 'lightbox';
    lb.className = 'lightbox';
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.setAttribute('aria-label', 'Photo lightbox');

    var img = document.createElement('img');
    img.className = 'lightbox__img';
    img.alt = '';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'lightbox__close';
    closeBtn.setAttribute('aria-label', 'Close gallery');
    closeBtn.textContent = '×';

    var prevBtn = document.createElement('button');
    prevBtn.className = 'lightbox__arrow lightbox__prev';
    prevBtn.setAttribute('aria-label', 'Previous photo');
    prevBtn.textContent = '‹';

    var nextBtn = document.createElement('button');
    nextBtn.className = 'lightbox__arrow lightbox__next';
    nextBtn.setAttribute('aria-label', 'Next photo');
    nextBtn.textContent = '›';

    lb.appendChild(img);
    lb.appendChild(closeBtn);
    lb.appendChild(prevBtn);
    lb.appendChild(nextBtn);
    document.body.appendChild(lb);

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', function () { navigateLightbox(-1); });
    nextBtn.addEventListener('click', function () { navigateLightbox(1); });

    /* Close on backdrop click (not on image or controls) */
    lb.addEventListener('click', function (e) {
      if (e.target === lb) { closeLightbox(); }
    });

    return { lb: lb, img: img };
  }

  function openLightbox(itemEl) {
    var idx = realImageItems.indexOf(itemEl);
    if (idx === -1) { return; }
    currentIndex = idx;

    if (!lightbox) {
      var built = buildLightbox();
      lightbox    = built.lb;
      lightboxImg = built.img;
    }

    updateLightboxImage();
    lightbox.classList.add('lightbox--open');
    document.body.style.overflow = 'hidden';
    lightbox.querySelector('.lightbox__close').focus();
  }

  function closeLightbox() {
    if (!lightbox) { return; }
    lightbox.classList.remove('lightbox--open');
    document.body.style.overflow = '';
  }

  function navigateLightbox(direction) {
    currentIndex = (currentIndex + direction + realImageItems.length) % realImageItems.length;
    updateLightboxImage();
  }

  function updateLightboxImage() {
    var item   = realImageItems[currentIndex];
    var imgEl  = item.querySelector('img');
    lightboxImg.src = imgEl.src;
    lightboxImg.alt = imgEl.alt;
  }

  /* Keyboard support */
  document.addEventListener('keydown', function (e) {
    if (!lightbox || !lightbox.classList.contains('lightbox--open')) { return; }
    if (e.key === 'ArrowLeft')  { navigateLightbox(-1); }
    if (e.key === 'ArrowRight') { navigateLightbox(1); }
    if (e.key === 'Escape')     { closeLightbox(); }
  });

  /* Wire click handlers to real image items only */
  realImageItems.forEach(function (item) {
    item.style.cursor = 'pointer';
    item.addEventListener('click', function () {
      openLightbox(item);
    });
  });

}());
</script>
