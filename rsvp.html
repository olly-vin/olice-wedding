<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>RSVP — Alex & Jamie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="RSVP to the wedding of Alex & Jamie.">
    <link rel="canonical" href="https://your-domain.example/rsvp.html">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:title" content="RSVP — Alex & Jamie">
    <meta property="og:description" content="Let us know if you can join us.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-domain.example/rsvp.html">
    <meta property="og:image" content="https://your-domain.example/og-image.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="RSVP — Alex & Jamie">
    <meta name="twitter:description" content="Let us know if you can join us.">
    <meta name="twitter:image" content="https://your-domain.example/og-image.jpg">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self' https:; upgrade-insecure-requests">
    <link rel="stylesheet" href="styles.css">
    <script>document.addEventListener('DOMContentLoaded',function(){
      const form=document.getElementById('rsvp-form');
      const live=document.getElementById('form-live');
      function setError(id,msg){
        const el=document.getElementById(id);
        el.setAttribute('aria-invalid','true');
        const err=document.getElementById(id+'-error');
        err.textContent=msg;
        live.textContent=msg;
      }
      function clearError(id){
        const el=document.getElementById(id);
        el.removeAttribute('aria-invalid');
        const err=document.getElementById(id+'-error');
        err.textContent='';
      }
      form.addEventListener('submit',function(e){
        let ok=true;
        clearError('name'); clearError('email'); clearError('attendance');

        const name=document.getElementById('name').value.trim();
        const email=document.getElementById('email').value.trim();
        const attendance=document.getElementById('attendance').value;
        const honeypot=document.getElementById('company').value;

        if(honeypot){ ok=false; }

        if(!name){ ok=false; setError('name','Please enter your full name.'); }
        if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ ok=false; setError('email','Please enter a valid email.'); }
        if(!attendance){ ok=false; setError('attendance','Please select your attendance.'); }

        if(!ok){ e.preventDefault(); }
      });
    });</script>
</head>
<body>
    <a class="visually-hidden" href="#main">Skip to content</a>
    <header class="header">
        <div class="container header__inner">
            <div class="header__brand">Alex & Jamie</div>
            <button id="nav-toggle" class="nav-toggle" aria-controls="site-nav" aria-expanded="false">Menu</button>
            <nav id="site-nav" class="nav" aria-label="Primary">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Home</a></li>
                    <li><a class="nav__link" href="rsvp.html" aria-current="page">RSVP</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main" class="container section">
        <h1 style="font-size:var(--fs-h1);line-height:var(--lh-tight);margin-top:0">RSVP</h1>
        <p class="helper">Please RSVP by June 1, 2026.</p>
        <div role="status" aria-live="polite" id="form-live" class="visually-hidden"></div>

        <form id="rsvp-form" class="form" method="POST" action="/.netlify/functions/rsvp">
            <input type="text" name="company" id="company" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="form__group">
                <label for="name" class="label">Full name</label>
                <input id="name" name="name" class="input" type="text" autocomplete="name" required aria-describedby="name-error">
                <div id="name-error" class="error" aria-live="polite"></div>
            </div>

            <div class="form__group">
                <label for="email" class="label">Email</label>
                <input id="email" name="email" class="input" type="email" autocomplete="email" required aria-describedby="email-error">
                <div id="email-error" class="error" aria-live="polite"></div>
            </div>

            <div class="form__group">
                <label for="attendance" class="label">Attendance</label>
                <select id="attendance" name="attendance" class="select" required aria-describedby="attendance-error">
                    <option value="">Select...</option>
                    <option value="accepts">Accepts with pleasure</option>
                    <option value="declines">Declines with regret</option>
                </select>
                <div id="attendance-error" class="error" aria-live="polite"></div>
            </div>

            <div class="form__group">
                <label for="guests" class="label">Number of guests (including you)</label>
                <input id="guests" name="guests" class="input" type="number" min="1" max="10" value="1">
                <div class="helper">If bringing guests, include their names in the message.</div>
            </div>

            <div class="form__group">
                <label for="dietary" class="label">Dietary preferences</label>
                <input id="dietary" name="dietary" class="input" type="text" placeholder="Vegetarian, gluten-free, etc.">
            </div>

            <div class="form__group">
                <label for="message" class="label">Message</label>
                <textarea id="message" name="message" class="textarea" rows="4"></textarea>
            </div>

            <div class="form__actions">
                <button type="submit" class="btn">Send RSVP</button>
                <a class="nav__link" href="index.html">Back to Home</a>
            </div>

            <p class="helper">We’ll email a confirmation after submission.</p>
        </form>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p>© 2026 Alex & Jamie · <a href="mailto:hello@example.com?subject=Wedding RSVP">Contact us</a></p>
        </div>
    </footer>
</body>
</html>
